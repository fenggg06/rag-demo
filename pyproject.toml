[project]
name = "agent-uv"
version = "0.1.0"
description = "基于 RAG 的高校转专业知识库问答系统（LangChain + Chroma + DeepSeek + 千问向量模型）"
readme = "README.md"
authors = [
    { name = "yhy", email = "haoyuanyin9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # --- 文档加载与切分 ---
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "beautifulsoup4>=4.15.0",
    # --- 向量化与向量库 ---
    "langchain-openai>=1.6.7",
    "langchain-chroma>=1.1.0",
    "chromadb>=1.5.9",
    # --- Agent 编排与对话模型 ---
    "langchain>=1.4.3",
    "langchain-deepseek>=1.1.1",
    # --- 环境变量 ---
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
